import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
import static org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9

apply plugin: 'kotlin'
apply plugin: 'net.corda.plugins.cordapp'
apply plugin: 'net.corda.plugins.quasar-utils'

cordapp {
    targetPlatformVersion 4
    minimumPlatformVersion 1
    workflow {
        name "corda-updates-transport"
        vendor "com.r3"
        licence "http://www.apache.org/licenses/LICENSE-2.0"
        versionId 1
    }
    signing {
        enabled false
    }

}

sourceSets {
    main {
        resources {
            srcDir "config/dev"
        }
    }
    test {
        resources {
            srcDir "config/test"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    // maven resolver dependencies
    implementation "org.apache.maven.resolver:maven-resolver-api:$maven_resolver_version"
    implementation "org.apache.maven.resolver:maven-resolver-impl:$maven_resolver_version"
    implementation "org.apache.maven.resolver:maven-resolver-connector-basic:$maven_resolver_version"
    implementation "org.apache.maven.resolver:maven-resolver-transport-http:$maven_resolver_version"
    implementation "org.apache.maven.resolver:maven-resolver-transport-file:$maven_resolver_version"
    implementation "org.apache.maven.resolver:maven-resolver-util:$maven_resolver_version"
    implementation "org.apache.maven.resolver:maven-resolver-spi:$maven_resolver_version"
    implementation("org.apache.maven:maven-resolver-provider:3.5.4") {
        exclude group: "org.apache.maven.resolver", module: "*"
    }
    implementation("com.typesafe:config:$typesafe_config_version")
    implementation project(":bn-apps:businessnetworks-utilities")
    // corda dependencies
    cordaProvided "$corda_release_group:corda-core:$corda_release_version"
    cordaProvided "$corda_release_group:corda-node-api:$corda_release_version"

    testImplementation "$corda_release_group:corda-node-driver:$corda_release_version"
    testImplementation project(":bn-apps:cordapp-updates-distribution:corda-updates-test-utils")

    // test dependencies
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "junit:junit:$junit_version"
    testImplementation project(':bn-apps:cordapp-updates-distribution:corda-updates-core')
    testImplementation "co.paralleluniverse:quasar-core:$quasar_version"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    compilerOptions {
        languageVersion = KOTLIN_1_9
        apiVersion = KOTLIN_1_9
        jvmTarget = JVM_17
        javaParameters = true   // Useful for reflection.
    }
}

tasks.jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    jvmArgs = rootProject.ext.testJvmArgs
}